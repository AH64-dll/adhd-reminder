name: Build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libx11-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Windows'
        name: Check Windows PowerShell 5.1 setup syntax
        shell: powershell
        run: .\scripts\check-windows-setup.ps1 -ParseOnly
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - if: runner.os == 'Windows'
        name: Verify Windows installation, upgrade, startup controls, and uninstall
        shell: powershell
        run: .\scripts\check-windows-setup.ps1 -Binary .\target\release\adhd.exe
      - uses: actions/upload-artifact@v4
        with:
          name: adhd-${{ runner.os }}
          path: |
            target/release/adhd
            target/release/adhd.exe
            scripts/
            integrations/
            README.md
            Setup.cmd
            Uninstall.cmd
