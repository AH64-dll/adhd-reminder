[package]
name = "adhd"
version = "0.1.1"
edition = "2021"
rust-version = "1.92"
description = "A quiet, persistent reminder of your current goal"
license = "MIT"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "unstable-winit-030", "accessibility"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rand = "0.9"
fs2 = "0.4"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
x11rb = { version = "0.13", features = ["randr"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_System_StationsAndDesktops"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

[profile.dev]
debug = 0
